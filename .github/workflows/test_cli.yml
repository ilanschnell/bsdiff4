name: test CLI

on:
  workflow_dispatch:

jobs:
  test:
    name: Test CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install reference bsdiff tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bsdiff

      - run: bash devel/test_cli.sh
