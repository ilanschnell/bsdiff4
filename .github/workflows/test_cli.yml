name: test CLI

on:
  workflow_dispatch:

jobs:
  test:
    name: Test CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install reference bsdiff tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bsdiff

      - run: bash devel/test_cli.sh

  test-python37:
    name: Self-tests on Python 3.7 with C assertions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.7"

      - name: Build with C assertions enabled
        run: python -m pip install -v .
        env:
          CFLAGS: -UNDEBUG

      - name: Run self-tests
        working-directory: /tmp
        run: |
          python - <<'EOF'
          import bsdiff4.core
          assert bsdiff4.core.DEBUG
          assert bsdiff4.test().wasSuccessful()
          EOF
          python "$GITHUB_WORKSPACE/devel/test_suffix_array.py"
