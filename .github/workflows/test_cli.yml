name: test CLI

on:
  workflow_dispatch:

jobs:
  test:
    name: Test CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install reference bsdiff tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bsdiff

      - run: bash devel/test_cli.sh

  test-python37:
    name: Self-tests on Python 3.7
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.7"

      - run: python -m pip install .

      - run: python -c "import bsdiff4; assert bsdiff4.test().wasSuccessful()"
